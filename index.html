<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="20分ごとに30秒〜、遠くを見て目を休ませるタイマー">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>20-20-20 タイマー</title>
  <style>
    :root {
      --bg-color:#0f172a; --card-bg:#1e293b; --primary:#38bdf8;
      --accent:#4ade80; --danger:#fb7185; --text:#f8fafc; --sub:#94a3b8;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; min-height:100dvh;
      padding:max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      background:var(--bg-color); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      display:flex; justify-content:center; align-items:center;
    }
    .container {
      width:min(92vw,400px); background:var(--card-bg); padding:36px 24px 28px;
      border-radius:24px; box-shadow:0 20px 25px -5px rgba(0,0,0,.5);
      text-align:center; position:relative;
    }
    h1 { font-size:1.5rem; margin:0 0 7px; }
    .subtitle { color:var(--sub); font-size:.875rem; margin-bottom:28px; }
    .status-badge {
      display:inline-block; padding:5px 13px; border-radius:999px;
      font-size:.875rem; font-weight:700; margin-bottom:18px;
      background:#334155; color:var(--primary);
    }
    .timer-display {
      font-size:clamp(3.6rem,16vw,5rem); font-weight:700;
      font-variant-numeric:tabular-nums; letter-spacing:-3px;
      margin:0 0 28px; line-height:1;
    }
    .btn-group {
      display:flex; gap:10px; justify-content:center;
    }
    .btn {
      flex:1; min-height:58px; padding:14px 12px; font-size:1.05rem;
      font-weight:700; border:0; border-radius:14px; cursor:pointer;
      background:var(--primary); color:#0f172a;
      box-shadow:0 4px 12px rgba(56,189,248,.3);
      -webkit-tap-highlight-color:transparent;
      transition: all 0.2s ease;
    }
    .btn:active { transform:scale(.98); }
    .btn-relax { background:var(--accent); box-shadow:0 4px 12px rgba(74,222,128,.3); animation:pulse 1.5s infinite; }
    .btn-stop { background:#475569; color:var(--text); box-shadow:none; }
    .btn-reset {
      flex:0 0 80px; background:#334155; color:var(--sub); font-size:0.9rem;
      box-shadow:none;
    }
    .info { margin-top:20px; font-size:.75rem; color:var(--sub); line-height:1.55; }
    .small { margin-top:12px; font-size:.7rem; color:#64748b; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.025)} }

    /* モーダルダイアログ UI */
    .modal-overlay {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(15, 23, 42, 0.85); backdrop-filter:blur(4px);
      display:flex; justify-content:center; align-items:center;
      z-index:999; opacity:0; pointer-events:none; transition:opacity 0.2s ease;
    }
    .modal-overlay.active { opacity:1; pointer-events:auto; }
    .modal-box {
      background:var(--card-bg); border:1px solid #334155;
      padding:24px; border-radius:20px; width:min(85vw, 320px);
      text-align:center; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);
    }
    .modal-title { font-size:1.1rem; font-weight:700; margin-bottom:8px; }
    .modal-sub { font-size:0.8rem; color:var(--sub); margin-bottom:16px; }
    .pin-input {
      width:100%; font-size:1.5rem; text-align:center; letter-spacing:8px;
      padding:10px; border-radius:10px; border:1px solid #475569;
      background:#0f172a; color:var(--text); outline:none; margin-bottom:12px;
    }
    .pin-input:focus { border-color:var(--primary); }
    .error-msg { color:var(--danger); font-size:0.75rem; min-height:1.2em; margin-bottom:12px; }
    .modal-btns { display:flex; gap:8px; }
    .btn-cancel { background:#334155; color:var(--text); flex:1; min-height:44px; border-radius:10px; border:0; font-weight:700; cursor:pointer; }
    .btn-confirm { background:var(--danger); color:#fff; flex:1; min-height:44px; border-radius:10px; border:0; font-weight:700; cursor:pointer; }
  </style>
</head>
<body>
  <main class="container">
    <h1>20-20-20 タイマー</h1>
    <div class="subtitle">ゲーム中の目を休ませる習慣</div>

    <div id="status" class="status-badge">準備完了</div>
    <div id="timer" class="timer-display">20:00</div>
    
    <div class="btn-group">
      <button id="actionBtn" class="btn">タイマーを開始する</button>
      <button id="resetBtn" class="btn btn-reset">リセット</button>
    </div>

    <div class="info">
      20分ごとに遠くを見て目を休ませます。<br>
      ※放置時間に応じて次のゲーム時間や休憩時間が調整されます。
    </div>
    <div id="soundInfo" class="small">開始時に音声機能を有効化します。</div>
  </main>

  <!-- 暗証番号入力用モーダル -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">リセットの確認</div>
      <div class="modal-sub">暗証番号「2020」を入力してください</div>
      <input type="password" id="pinInput" class="pin-input" maxlength="4" pattern="\d*" inputmode="numeric" placeholder="••••">
      <div id="errorMsg" class="error-msg"></div>
      <div class="modal-btns">
        <button id="modalCancel" class="btn-cancel">キャンセル</button>
        <button id="modalConfirm" class="btn-confirm">リセット</button>
      </div>
    </div>
  </div>

<script>
'use strict';

const NORMAL_WORK_TIME = 20 * 60; // 20分 (秒)
const PENALTY_WORK_TIME = 15 * 60; // 15分 (秒)
const BASE_RELAX_TIME = 30;       // 30秒
const RESET_PIN = "2020";          // リセット用暗証番号

let state = 'STOPPED';     // STOPPED / WORK / ANNOUNCE / RELAX
let endAt = 0;             // 現在フェーズの終了予定時刻 (ms)
let announceStartAt = 0;   // アナウンス開始時刻 (ms)
let pausedRemaining = NORMAL_WORK_TIME;
let nextWorkDuration = NORMAL_WORK_TIME;
let timerId = null;
let announceAudioTimer = null;

let audioCtx = null;
let relaxGainNode = null;
let relaxNodes = [];
let notificationRequested = false;

const timerEl = document.getElementById('timer');
const statusEl = document.getElementById('status');
const actionBtn = document.getElementById('actionBtn');
const resetBtn = document.getElementById('resetBtn');
const soundInfoEl = document.getElementById('soundInfo');

const modalOverlay = document.getElementById('modalOverlay');
const pinInput = document.getElementById('pinInput');
const errorMsg = document.getElementById('errorMsg');
const modalCancel = document.getElementById('modalCancel');
const modalConfirm = document.getElementById('modalConfirm');

function initAudio() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    soundInfoEl.textContent = '音声機能：有効';
  } catch (e) {
    soundInfoEl.textContent = '音声機能を利用できません';
  }
}

function requestNotification() {
  if (!('Notification' in window) || notificationRequested) return;
  notificationRequested = true;
  if (Notification.permission === 'default') {
    Notification.requestPermission().catch(() => {});
  }
}

function sendNotification(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification(title, { body }); } catch(e) {}
  }
}

function startAnnounceSound() {
  stopAnnounceSound();
  if (!audioCtx) return;

  function playChime() {
    if (state !== 'ANNOUNCE') return;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    const base = audioCtx.currentTime;

    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const t = base + i * 0.22;
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.65);
    });
  }

  playChime();
  const intervalId = setInterval(() => {
    if (Date.now() - announceStartAt > 60000 || state !== 'ANNOUNCE') {
      clearInterval(intervalId);
    } else {
      playChime();
    }
  }, 1200);

  announceAudioTimer = intervalId;
}

function stopAnnounceSound() {
  if (announceAudioTimer) {
    clearInterval(announceAudioTimer);
    announceAudioTimer = null;
  }
}

function startRelaxSound() {
  stopRelaxSound(true);
  if (!audioCtx) return;

  relaxGainNode = audioCtx.createGain();
  const now = audioCtx.currentTime;
  relaxGainNode.gain.setValueAtTime(0.0001, now);
  relaxGainNode.gain.linearRampToValueAtTime(0.13, now + 1.5);
  relaxGainNode.connect(audioCtx.destination);

  const frequencies = [174.61, 220.00, 261.63, 329.63, 392.00];

  frequencies.forEach(freq => {
    const osc = audioCtx.createOscillator();
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.value = freq;
    lfo.type = 'sine';
    lfo.frequency.value = 0.18;
    lfoGain.gain.value = 1.2;

    lfo.connect(lfoGain).connect(osc.frequency);
    osc.connect(relaxGainNode);

    osc.start();
    lfo.start();
    relaxNodes.push(osc, lfo);
  });
}

function stopRelaxSound(immediate=false) {
  if (!relaxGainNode || !audioCtx) return;

  const gain = relaxGainNode;
  const nodes = relaxNodes.slice();
  relaxGainNode = null;
  relaxNodes = [];

  const now = audioCtx.currentTime;
  try {
    if (immediate) gain.gain.cancelScheduledValues(now);
    gain.gain.setValueAtTime(immediate ? 0.0001 : Math.max(gain.gain.value, 0.0001), now);
    if (!immediate) gain.gain.linearRampToValueAtTime(0.0001, now + 1.0);
  } catch(e) {}

  setTimeout(() => {
    nodes.forEach(n => { try { n.stop(); } catch(e) {} });
    try { gain.disconnect(); } catch(e) {}
  }, immediate ? 0 : 1100);
}

function formatTime(seconds) {
  seconds = Math.max(0, Math.ceil(seconds));
  const m = Math.floor(seconds / 60).toString().padStart(2, '0');
  const s = (seconds % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function updateDisplay() {
  if (state === 'STOPPED') {
    timerEl.textContent = formatTime(pausedRemaining);
    return;
  }
  if (state === 'ANNOUNCE') {
    const elapsedSec = Math.floor((Date.now() - announceStartAt) / 1000);
    timerEl.textContent = formatTime(elapsedSec);
    return;
  }
  const remaining = Math.max(0, (endAt - Date.now()) / 1000);
  timerEl.textContent = formatTime(remaining);
}

function setButton(text, className='btn') {
  actionBtn.textContent = text;
  actionBtn.className = className;
}

function startLoop() {
  clearInterval(timerId);
  timerId = setInterval(tick, 250);
  tick();
}

function startWorkTimer(seconds=NORMAL_WORK_TIME) {
  stopRelaxSound();
  stopAnnounceSound();
  state = 'WORK';
  endAt = Date.now() + seconds * 1000;
  pausedRemaining = seconds;

  const mins = Math.round(seconds / 60);
  statusEl.textContent = `ゲーム中（${mins}分計測）`;
  statusEl.style.color = 'var(--primary)';
  setButton('一時停止');
  startLoop();
}

function startRelaxTimer(durationSec) {
  stopAnnounceSound();
  state = 'RELAX';
  endAt = Date.now() + durationSec * 1000;

  statusEl.textContent = '遠くを見て目を休ませ中…';
  statusEl.style.color = 'var(--accent)';
  setButton('リラックス中（自動で再開）', 'btn btn-stop');

  startRelaxSound();
  startLoop();
}

function enterAnnounce() {
  state = 'ANNOUNCE';
  announceStartAt = Date.now();
  timerEl.textContent = '00:00';

  startAnnounceSound();
  sendNotification('20分経過しました！', '目を休ませましょう。ボタンを押して休憩を始めてください。');

  statusEl.textContent = '遠くを見る時間です！';
  statusEl.style.color = 'var(--danger)';
  setButton('休憩スタート（ヒーリング音）', 'btn btn-relax');
  
  startLoop();
}

function finishRelax() {
  stopRelaxSound();
  startWorkTimer(nextWorkDuration);
  nextWorkDuration = NORMAL_WORK_TIME;
}

function tick() {
  if (state === 'ANNOUNCE') {
    updateDisplay();
    return;
  }
  if (state !== 'WORK' && state !== 'RELAX') return;

  const remaining = (endAt - Date.now()) / 1000;
  updateDisplay();

  if (remaining <= 0) {
    if (state === 'WORK') enterAnnounce();
    else if (state === 'RELAX') finishRelax();
  }
}

function pauseWork() {
  pausedRemaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
  clearInterval(timerId);
  timerId = null;
  state = 'STOPPED';

  updateDisplay();
  statusEl.textContent = '一時停止中';
  statusEl.style.color = 'var(--sub)';
  setButton('再開する');
}

function resetAll() {
  stopAnnounceSound();
  stopRelaxSound(true);
  clearInterval(timerId);
  timerId = null;
  
  state = 'STOPPED';
  pausedRemaining = NORMAL_WORK_TIME;
  nextWorkDuration = NORMAL_WORK_TIME;
  
  updateDisplay();
  statusEl.textContent = '準備完了';
  statusEl.style.color = 'var(--primary)';
  setButton('タイマーを開始する');
}

// モーダル表示・非表示処理
function openPinModal() {
  pinInput.value = '';
  errorMsg.textContent = '';
  modalOverlay.classList.add('active');
  setTimeout(() => pinInput.focus(), 100);
}

function closePinModal() {
  modalOverlay.classList.remove('active');
  pinInput.blur();
}

function handlePinSubmit() {
  if (pinInput.value === RESET_PIN) {
    closePinModal();
    resetAll();
  } else {
    errorMsg.textContent = '暗証番号が正しくありません';
    pinInput.value = '';
    pinInput.focus();
  }
}

actionBtn.addEventListener('click', () => {
  initAudio();
  requestNotification();

  if (state === 'STOPPED') {
    startWorkTimer(pausedRemaining > 0 && pausedRemaining < NORMAL_WORK_TIME ? pausedRemaining : NORMAL_WORK_TIME);
  } else if (state === 'ANNOUNCE') {
    const elapsedSec = (Date.now() - announceStartAt) / 1000;
    let relaxTime = BASE_RELAX_TIME;
    nextWorkDuration = NORMAL_WORK_TIME;

    if (elapsedSec >= 300) {
      relaxTime = 5 * 60;
      nextWorkDuration = PENALTY_WORK_TIME;
    } else if (elapsedSec >= 180) {
      relaxTime = 3 * 60;
      nextWorkDuration = PENALTY_WORK_TIME;
    } else if (elapsedSec >= 60) {
      relaxTime = BASE_RELAX_TIME;
      nextWorkDuration = PENALTY_WORK_TIME;
    }

    startRelaxTimer(relaxTime);
  } else if (state === 'WORK') {
    pauseWork();
  }
});

resetBtn.addEventListener('click', () => {
  initAudio();
  openPinModal();
});

modalCancel.addEventListener('click', closePinModal);
modalConfirm.addEventListener('click', handlePinSubmit);

pinInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') handlePinSubmit();
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (state === 'WORK' || state === 'RELAX' || state === 'ANNOUNCE') tick();
  }
});
window.addEventListener('pageshow', () => {
  if (state === 'WORK' || state === 'RELAX' || state === 'ANNOUNCE') tick();
});

updateDisplay();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
